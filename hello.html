<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
}

.card{
    width:440px;
    background:#f5f5f5;
    border:3px solid black;
    border-radius:25px;
    overflow:hidden;
}

.header{
    height:190px;
    background:royalblue;
}

.profile-img{
    width:145px;
    height:145px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid black;
    margin:-72px auto 15px;
    background:white;
}

.profile-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    text-align:center;
}

.info h2{
    font-size:24px;
    margin-bottom:8px;
}

.info p{
    color:gray;
    font-size:18px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:40px 0;
}

.stat{
    text-align:center;
}

.circle{
    width:62px;
    height:62px;
    border:2px solid black;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    margin-bottom:8px;
}

.stat p{
    font-size:14px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:25px;
}

button{
    width:135px;
    height:50px;
    border:2px solid black;
    border-radius:14px;
    background:white;
    font-size:16px;
    cursor:pointer;
}

.actions{
    display:flex;
    justify-content:space-around;
    padding:20px 0;
}

.action{
    text-align:center;
    cursor:pointer;
}

.action span{
    font-size:30px;
}

.action p{
    margin-top:8px;
    font-size:16px;
}

</style>
</head>
<body>

<div class="card">

    <div class="header"></div>

    <div class="profile-img">
        <img src="SS.jpg" alt="Taylor Swift">
    </div>

    <div class="info">
        <h2>Sachi Singh</h2>
        <p>Frontend Developer</p>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

    </div>

    <div class="buttons">
        <button>Follow</button>
        <button>Message</button>
    </div>

    <div class="actions">

        <div class="action">
            <span>👍</span>
            <p>Like</p>
        </div>

        <div class="action">
            <span>💬</span>
            <p>Comment</p>
        </div>

        <div class="action">
            <span>📤</span>
            <p>Share</p>
        </div>

    </div>

</div>

</body>
</html>
