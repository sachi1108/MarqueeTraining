    font-width: calc(200px + 2vw);

.video-box{
    position: fixed;
    width: 200px;
    height: 300px;
    border-radius: 12px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .1s linear;
    z-index: 3;
}

.video-box.active{

}

.video-box video{
    width:100%;
    height:100%;

}

    display:flex;

    height:85%;

    border-radius:20px;

<body>

<nav class="navbar">

    <div class="nav-left">
        <a href="#">Studio Namma</a>

    <div class="nav-center">
        <a href="#">Menu</a>

        <a href="#">Let's Talk!</a>
    </div>

</nav>

<div class="landing">

    <div class="main-text">
        <span class="line line1">WE THINK</span>
        <span class="line line2">CRAFT AND</span>
        <span class="line line3">DESIGN</span>
    </div>
    

    <div class="video-box" id="videoBox">
        <video muted loop playsinline>
            <source src="hellu.mp4" type="video/mp4">
        </video>
    </div>

</div>
<section class="video-section">
    <video autoplay muted loop playsinline>
        <source src="hellu.mp4" type="video/mp4">
    </video>
</section>

<script>
const videoBox = document.getElementById("videoBox");
const video = videoBox.querySelector("video");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let currentX = mouseX;
let currentY = mouseY;

let lastX = mouseX;
let lastY = mouseY;

let rotX = 0;
let rotY = 0;

document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animate() {

    currentX += (mouseX - currentX) * 0.15;
    currentY += (mouseY - currentY) * 0.15;

    // Mouse velocity
    const vx = mouseX - lastX;
    const vy = mouseY - lastY;

    lastX = mouseX;
    lastY = mouseY;

    // Rotation from velocity
    rotY += vx * 0.3;
    rotX -= vy * 0.3;

    // Smoothly return to center
    rotX *= 0.88;
    rotY *= 0.88;

    videoBox.style.left = `${currentX + 40}px`;
    videoBox.style.top = `${currentY - 30}px`;

    videoBox.style.transform = `
        translate(-50%,-50%)
        perspective(1000px)
        rotateX(${rotX}deg)
        rotateY(${rotY}deg)
        rotateZ(${vx * 0.08}deg)
    `;

    requestAnimationFrame(animate);
}

animate();

document.addEventListener("mouseenter", () => {
    videoBox.classList.add("active");
    video.play();
});

document.addEventListener("mouseleave", () => {
    videoBox.classList.remove("active");
    video.pause();
    video.currentTime = 0;
});
</script>

</body>
