<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    height:100vh;
    overflow:hidden;
    position:relative;
}

.snake{
    position:relative;
}

.box{
    width: 250px;
    height:250px;
    position:absolute;
    top:50px;
    left:50px;
    border-radius:8px;
    animation:snakeMove 8s linear infinite;

}

.head{
    background:green;
}

.body1{
    background:red;
    animation-delay:0.3s;
}

.body2{
    background:yellow;
    animation-delay:0.6s;
}

@keyframes snakeMove{
    0%{
        transform:translate(0,0);
    }
    25%{
        transform:translate(900px,0);
    }
    50%{
        transform:translate(900px,450px);
    }

    75%{
        transform:translate(0,450px);
    }
    100%{
        transform:translate(0,0);
    }
}
</style>
</head>
