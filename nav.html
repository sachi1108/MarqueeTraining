<!DOCTYPE html>
<html>
<head>
    <title>Navbar Design</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color:powderblue;
            padding: 1z0px;
        }

        nav{
            height: 110px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background-color:greenyellow;
            position: sticky;
        }

        .logo{
            width: 110px;
            height: 70px;
            border: 2px solid black;
            border-radius: 50%;
            background-color: aqua;
        }

        .menu{
            display: flex;
            gap: 20px;
        }

        .box{
            width: 120px;
            height: 60px;
            border: 2px solid black;
            background-color: aqua;
        }

        .small{
            width: 90px;
        }
    </style>
</head>

<body>

    <nav>
        
        <div class="logo"></div>
        <div class="menu">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box small"></div>
        </div>

    </nav>

</body>
</html>
