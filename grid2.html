<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>
.container{
    width:800px;
    height:550px;
    border:2px solid black;
    padding:15px;
    display:grid;
    gap:15px;

    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
}

.box{
    border:2px solid black;
}
.box1{
    grid-row:1 / 3;
    grid-column:1 / 2;
}
.box2{
    grid-row:1;
    grid-column:2;
}
.box3{
    grid-row:1;
    grid-column:3;
}
.box4{
    grid-row:2;
    grid-column:2;
}
.box5{
    grid-row:2;
    grid-column:3;
}
.box6{
    grid-column:1 / 4;
    grid-row:3;
}
</style>
</head>

<body>

<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
</div>

</body>
</html>
