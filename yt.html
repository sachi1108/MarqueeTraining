<!DOCTYPE html>
<html>
<head>
  <title>utob</title>

  <style>

    body{
      margin:0;
      background:pink;
      font-family: sans-serif;
    }

    .topbar{
      height:70px;
      background:white;
      padding:10px;
    }

    .logo{
      width:90px;
      height:35px;
      border:2px solid black;
      border-radius:8px;
      display:inline-block;
      margin-top:5px;
    }

    .search{
      width:400px;
      height:35px;
      border:2px solid black;
      border-radius:20px;
      display:inline-block;
      margin-left:180px;
    }

    .profile{
      width:40px;
      height:40px;
      border:2px solid black;
      border-radius:50%;
      float:right;
      margin-top:2px;
    }

    .sidebar{
      width:90px;
      height:100vh;
      background:white;
      float:left;
      border-right:1px solid black;
    }

    .menu{
      width:65px;
      height:35px;
      border:2px solid black;
      border-radius:10px;
      margin:20px auto;
    }

    .main{
      margin-left:100px;
      padding:20px;
    }

    .buttons{
      margin-bottom:20px;
    }

    .btn{
      width:80px;
      height:30px;
      border:2px solid black;
      /* border-radius:10px; */
      display:inline-block;
      /* margin-right:10px; */
      background:white;
    }

    .video{
      width:300px;
      background:white;
      padding:10px;
      border-radius:10px;
      display: inline-block;
      margin:15px;
    }

    .thumb{
      width:100%;
      height:170px;
      border:2px solid black;
      border-radius:3px;
      vertical-align: middle;
    }

    .bottom{
      margin-top:10px;
    }

    .channel{
      width:45px;
      height:45px;
      border:2px solid black;
      border-radius:50%;
      display:inline-block;
    }

    .text{
      width:170px;
      height:35px;
      border:2px solid black;
      display:inline-block;
      margin-left:10px;
    }

  </style>

</head>

<body>

  <div class="topbar">

    <div class="logo"></div>

    <div class="search"></div>

    <div class="profile"></div>

  </div>

  <div class="sidebar">

    <div class="menu"></div>
    <div class="menu"></div>
    <div class="menu"></div>
    <div class="menu"></div>
    <div class="menu"></div>

  </div>

  <div class="main">

    <div class="buttons">

      <div class="btn"></div>
      <div class="btn"></div>
      <div class="btn"></div>
      <div class="btn"></div>

    </div>

    <div class="video">

      <div class="thumb"></div>

      <div class="bottom">

        <div class="channel"></div>
        <div class="text"></div>

      </div>

    </div>

    <div class="video">

      <div class="thumb"></div>

      <div class="bottom">

        <div class="channel"></div>
        <div class="text"></div>

      </div>

    </div>

    <div class="video">

      <div class="thumb"></div>

      <div class="bottom">

        <div class="channel"></div>
        <div class="text"></div>

      </div>

    </div>

  </div>

</body>
</html>
