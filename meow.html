<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layout Design</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f2f2f2;
    }

    .main-box{
      width:1100px;
      border:5px solid black;
      padding:20px;
      background:white;
    }

    .top-box{
      height:230px;
      border:5px solid black;
      margin-bottom:30px;
    }

    .middle{
      display:flex;
      justify-content:space-between;
      margin-bottom:30px;
    }

    .rect{
      width:48%;
      height:200px;
      border:5px solid black;
    }

    .bottom{
      display:flex;
      justify-content:space-around;
      align-items:center;
    }

    .square{
      width:190px;
      height:130px;
      border:5px solid black;
    }

    .circle{
      width:150px;
      height:150px;
      border:5px solid black;
      border-radius:50%;
      background-color:brown;
    }
  </style>
</head>

<body>

  <div class="main-box">

    <div class="top-box"></div>

    <div class="middle">
      <div class="rect"></div>
      <div class="rect"></div>
    </div>

    <div class="bottom">
      <div class="square"></div>
      <div class="circle"></div>
      <div class="square"></div>
      <div class="circle"></div>
    </div>

  </div>

</body>
</html>
