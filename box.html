<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Box with Small Boxes</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:yellowgreen;
    }
    .big-box{
      width:750px;
      height:450px;
      border:4px solid black;
      background:yellow;
      padding:20px;

      display:flex;
      flex-wrap:wrap;
      gap:15px;
      justify-content:center;
      align-content:center;
    }
    .small-box{
      width:90px;
      height:90px;
      background:green;
      border-radius:10px;
      border:2px solid #222;
    }
  </style>
</head>
<body>
  <div class="big-box">
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
    <div class="small-box"></div>
  </div>
</body>
</html>
