<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<style>
   *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
    body{
      background:white;
      height:100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container{
      width:95%;
      height:90vh;
      background:white;
      border:4px solid black;
      padding:20px;
    }
     .top-boxes{
      display:flex;
      gap:20px;
      margin-bottom:25px;
    }
    .small-box{
      width:180px;
      height:70px;
      border:4px solid black;
      border-radius:20px;
    }
    .search-row{
      display:flex;
      gap:15px;
      margin-bottom:30px;
    }
    .search-bar{
      flex:1;
      height:50px;
      border:4px solid black;
      border-radius:15px;
    }
</style>
<body>
     <div class="container">
    <div class="top-boxes">
      <div class="small-box yellow"></div>
      <div class="small-box"></div>
    </div>
    <div class="search-row">
      <div class="search-bar"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
    </div>
    <div class="categories">
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
    </div>
    <div class="bottom">
      <div class="big-card"></div>
      <div class="big-card"></div>
      <div class="side-card"></div>
    </div>
  </div>
</body>
</html>
