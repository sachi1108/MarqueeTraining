<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>

        body{
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            width: 1000px;
            height: 500px;
            border: 1px solid black;
            background-color: greenyellow;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            gap: 20px;
        }

        .row{
            display: flex;
            display: flex;
            gap: 8px;
        }

        .box{
            width: 180px;
            height: 140px;
            border: 2px solid black;
            background-color: greenyellow;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

    </div>

</body>
</html>
