<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Layout</title>

  <style>
    :root {
      --bg:white;
      --frame:black;
      --box:white;
      --outer-width: 760px;
      --top-height: 170px;
      --bottom-height: 170px;
      --gap: 24px;
      --radius: 2px;
      --stroke: 4px;
    }
    * {
      box-sizing: border-box;
    } 

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      background-color:beige ;
    }

    .frame {
      width: var(--outer-width);
      padding: 28px;
      border: var(--stroke) solid var(--frame);
      background:white;
      position: relative;
    }

    .top-section {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }

    .card {
      flex: 1;
      height: var(--top-height);
      border: var(--stroke) solid var(--frame);
      border-radius: var(--radius);
      background: var(--box);
      box-shadow: 0 4px 10px var(--shadow);
    }

    .banner {
      height: var(--bottom-height);
      border: var(--stroke) solid var(--frame);
      border-radius: var(--radius);
      background: var(--box);
      box-shadow: 0 4px 10px var(--shadow);
    }

    .circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: var(--stroke) solid var(--frame);
      background:pink;
      position: absolute;
      left: 50%;
      bottom: -38px;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>

  <div class="frame">

    <div class="top-section">
      <div class="card"></div>
      <div class="card"></div>
    </div>

    <div class="banner"></div>

    <div class="circle"></div>

  </div>

</body>
</html>
