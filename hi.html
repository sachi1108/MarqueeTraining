<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color: burlywood;
}

.card{
    width:350px;
    background:white;
    border:3px solid black;
    border-radius:20px;
    overflow:hidden;
}

.header{
    height:150px;
    background:royalblue;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid black;
    overflow:hidden;
    margin:-60px auto 15px;
    background:white;
}

.profile-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    text-align:center;
    padding:10px;
}

.info h2{
    margin-bottom:5px;
}

.info p{
    color:gray;
}

.stats{
    display:flex;
    justify-content:space-evenly;
    margin:25px 0;
}

.stat{
    text-align:center;
}

.circle{
    width:50px;
    height:50px;
    border:2px solid black;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:20px;
}

.stat p{
    margin-top:5px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

button{
    padding:10px 25px;
    border:2px solid black;
    border-radius:10px;
    background:white;
    cursor:pointer;
}



.actions{
    display:flex;
    justify-content:space-around;
    border-top:1px solid #ddd;
    padding:15px 0;
}

.action{
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.action:hover{
    transform:scale(1.1);
}

.action span{
    font-size:22px;
}

.action p{
    margin-top:5px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="card">

    <div class="header"></div>

    <div class="profile-img">
        <img src="tsy.jpeg" alt="Profile">
    </div>

    <div class="info">
        <h2>Taylor Swift</h2>
        <p>Frontend Developer</p>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

        <div class="stat">
            <div class="circle"></div>
        </div>

    </div>

    <div class="buttons">
        <button>Follow</button>
        <button>Message</button>
    </div>

    <div class="actions">

        <div class="action">
            <span></span>
            <p>Like</p>
        </div>

        <div class="action">
            <span></span>
            <p>Comment</p>
        </div>

        <div class="action">
            <span></span>
            <p>Share</p>
        </div>

    </div>

</div>

</body>
</html>
