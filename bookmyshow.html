<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }
        nav{
            background:#d9232d;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 50px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .search{
            width:40%;
            padding:10px;
            border:none;
            border-radius:5px;
        }

        .btn{
            background:white;
            color:#d9232d;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }
        .banner{
            width:100%;
            height:300px;
            background:url("banner.jpg");
            background-size:cover;
            background-position:center;
            justify-content: center;
            align-items: center;
        }
        .movies{
            padding:30px;
        }

        .movies h2{
            margin-bottom:20px;
        }

        .movie-container{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            justify-content:center;
        }

        .movie-card{
            width:220px;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        .movie-card img{
            width:100%;
            height:300px;
            object-fit:cover;
        }

        .movie-info{
            padding:15px;
            text-align:center;
        }

        .movie-info h3{
            margin-bottom:10px;
        }

        .book-btn{
            background:#d9232d;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:30px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">bookmyshow</div>

        <input type="text" class="search"
        placeholder="Search for Movies, Events, Plays">

        <button class="btn">Sign In</button>
    </nav>

    
    <div class="banner">
        <img src="movie.jpg" alt="">
    </div>


    <section class="movies">
        <h2>Recommended Movies</h2>

        <div class="movie-container">

            <div class="movie-card">
                <img src="movie1.jpg" alt="">
                <div class="movie-info">
                    <h3>Movie 1</h3>
                    <button class="book-btn">Book Now</button>
                </div>
            </div>

            <div class="movie-card">
                <img src="movie2.jpg" alt="">
                <div class="movie-info">
                    <h3>Movie 2</h3>
                    <button class="book-btn">Book Now</button>
                </div>
            </div>

            <div class="movie-card">
                <img src="movie3.jpg" alt="">
                <div class="movie-info">
                    <h3>Movie 3</h3>
                    <button class="book-btn">Book Now</button>
                </div>
            </div>

            <div class="movie-card">
                <img src="movie4.jpg" alt="">
                <div class="movie-info">
                    <h3>Movie 4</h3>
                    <button class="book-btn">Book Now</button>
                </div>
            </div>

        </div>
    </section>

    <footer>
        © 2026 BookMyShow
        
    </footer>

</body>
</html>
