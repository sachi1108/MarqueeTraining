<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Profile</title>
    <link rel='stylesheet' href='main.css'>
</head>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing: border-box;
        }    
    body{
      justify-content:center;
      align-items:center;
      height:100vh;
      background:white;
    }
    .main-box{
      width:1100px;
      border:5px solid black;
      padding:20px;
      background:white;
    }
    .top-section{
      display:flex;
      gap:35px;
      align-items:flex-start;
    }
    .circle{
      width:150px;
      height:150px;
      border:5px solid black;
      border-radius:50%;
      background-color:pink;
    }
     .top-rect{
      flex:1;
      height:190px;
      border:4px solid black;
      margin-top:10px;
    }
    .small-box{
      width:150px;
      height:145px;
      border:4px solid black;
    }
    .long-box{
        flex:1;
        height: 100px;
        border: 10px solid;
    }
    .bottom-section{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      padding:0 20px;
    }
    .bottom-box{
      width:165px;
      height:135px;
      border:4px solid black;
    }
    .pic{
    width: 300px;
    height: 200px;
    object-position: 0cm;
}

</style>
<body>
    <div class="main-box">

    <div class="top-section">
      <div class="circle"><img src="https://pbs.twimg.com/media/F6ULK4LXkAA_13f.png" class="pic"></div>
      <div class="top-rect"></div>
    </div>

    <div class="middle-section">
      <div class="small-box"></div>
      <div class="long-box"></div>
    </div>

    <div class="bottom-section">
      <div class="bottom-box"></div>
      <div class="bottom-box"></div>
      <div class="bottom-box"></div>
    </div>
    </div>
</body>
</html>
