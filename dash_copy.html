    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#1f242b;
            color:white;
        }

        .main{
            display:flex;
            min-height:100vh;
        }

        .sidebar{
            width:250px;
            background:#343a40;
            padding:20px;
        }

        .sidebar h2{
            margin-bottom:20px;
        }

        .sidebar ul{
            list-style:none;
        }

        .sidebar li{
            background:#495057;
            padding:15px;
            margin-bottom:10px;
            border-radius:5px;
            cursor:pointer;
        }

        .sidebar li:hover{
            background:#5c636a;
        }

        .content{
            flex:1;
            padding:20px;
        }

        .cards{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            margin-top:20px;
        }

        .card{
            flex:1;
            min-width:220px;
            height:120px;
            padding:20px;
            border-radius:5px;
        }

        .blue{
            background:#2179f8;
        }

        .green{
            background:#198754;
        }

        .yellow{
            background:#ffc107;
            color:black;
        }

        .red{
            background:#dc3545;
        }

        .card h2{
            font-size:40px;
            margin-bottom:10px;
        }

        .bottom{
            display:flex;
            gap:20px;
            margin-top:30px;
            align-items:flex-start;
        }

        .graph{
            width:70%;
            background:#2d333b;
            border:1px solid #555;
            padding:20px;
            border-radius:5px;
        }

        .graph h2{
            margin-bottom:20px;
        }

        .chart{
            width:100%;
            height:350px;
            overflow:hidden;
            border-radius:5px;
        }

        .chart img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
        }

        .map{
            width:30%;
            background:#0d6efd;
            padding:20px;
            border-radius:5px;
        }

        .map h2{
            margin-bottom:20px;
        }

        .world{
            width:100%;
            height:350px;
            overflow:hidden;
            background:white;
            border-radius:5px;
        }

        .world img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }

        @media(max-width:1000px){
            .bottom{
                flex-direction:column;
            }

            .graph,
            .map{
                width:100%;
            }
        }
    </style>
</head>
