<!DOCTYPE html>
<html>
<head>
<style>
  .box {
    width: 100px;
    background: black;
    padding: 10px;
  }

  .light {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin: 10px auto;
    background: gray;
  }

  .red { background: red; }
  .yellow { background: yellow; }
  .green { background: green; }
</style>
</head>

<body>

<div class="box">
  <div class="light red"></div>
  <div class="light yellow"></div>
  <div class="light green"></div>
</div>

</body>
</html>
