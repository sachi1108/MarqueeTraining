<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
    body{
      background:#f1f3f6;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .container{
      width:95%;
      height:90vh;
      background:white;
      border:4px solid black;
      padding:20px;
    }
    .top-boxes{
      display:flex;
      gap:20px;
      margin-bottom:25px;
    }
    .small-box{
      width:180px;
      height:70px;
      border:4px solid black;
      border-radius:20px;
    }
    .yellow{
      border-color:gold;
    }
   .search-row{
      display:flex;
      gap:15px;
      margin-bottom:30px;
    }
    .search-bar{
      flex:1;
      height:50px;
      border:4px solid black;
      border-radius:15px;
    }
    .icon-box{
      width:100px;
      height:50px;
      border:4px solid black;
      border-radius:15px;
    }
    .categories{
      display:flex;
      justify-content:space-between;
      margin-bottom:35px;
    }
    .cat{
      width:85px;
      height:45px;
      border:4px solid black;
      border-radius:12px;
    }
    .bottom{
      display:flex;
      gap:25px;
    }
    .big-card{
      flex:1;
      height:320px;
      border:4px solid black;
      border-radius:50px;
    }
    .side-card{
      width:180px;
      height:320px;
      border:4px solid black;
      border-radius:40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-boxes">
      <div class="small-box yellow"></div>
      <div class="small-box"></div>
    </div>
    <div class="search-row">
      <div class="search-bar"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
    </div>
    <div class="categories">
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
      <div class="cat"></div>
    </div>
    <div class="bottom">
      <div class="big-card"></div>
      <div class="big-card"></div>
      <div class="side-card"></div>
    </div>
  </div>
</body>
</html>
